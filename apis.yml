aid: miso-robotics
name: Miso Robotics
description: 'Miso Robotics is a Pasadena, California kitchen-automation company that
  builds AI-powered robotics and restaurant operations software for commercial food
  service. Its flagship product, Flippy, is an autonomous fry station that uses computer
  vision and NVIDIA-accelerated motion planning to identify food items, detect doneness
  and run up to 100 baskets per hour on existing commercial fryers from Frymaster,
  Henny Penny and Pitco. Miso also ships Zippy (built on the acquired Zignyl platform),
  a real-time digital shift manager for forecasting, scheduling, task management, incentives
  and payroll that connects to restaurant point-of-sale systems. Customers include
  White Castle, Jack in the Box, CaliBurger and Auntie Anne''s. Miso publishes no public
  developer API, no OpenAPI/AsyncAPI contract and no SDKs; its integrations are delivered
  as private partner connections (Toast, PAR and other POS vendors) arranged through
  sales, and its public GitHub organization carries ROS/robotics and cloud-infrastructure
  forks used internally rather than a client-facing API surface.'
